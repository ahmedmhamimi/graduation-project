<!-- edit_course.html -->
{% extends "base.html" %}
{% block navbar %}
<nav class="navbar navbar-expand-lg navbar-academic sticky-top">
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center">
            <div class="university-logo-container navbar-logo"><img src="{{ url_for('static', path='/img/logo.png') }}" alt="Logo"></div>
            <div class="ms-3"><span class="navbar-brand-text mb-0">{{ role_title }}</span></div>
        </div>
        <a href="/logout" class="btn btn-primary-academic btn-sm">Logout</a>
    </div>
</nav>
{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:600px;">
    <a href="/dashboard/{{ user.role_id }}" class="text-primary-academic fw-bold mb-3 d-inline-block">← Back to Dashboard</a>
    <h2 class="text-primary-academic fw-bold mb-4">Edit Course</h2>
    <div class="card-academic">
        <form action="/manage/course/edit/{{ course.id }}" method="POST">
            <input type="hidden" name="session_id" value="{{ session_id }}">
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label-academic">Subject</label>
                    <input type="text" value="{{ course.subject }}" disabled class="form-control-academic" style="background:#f8f9fa;">
                </div>
                <div class="col-md-6">
                    <label class="form-label-academic">Course Number *</label>
                    <input type="text" name="course_number" required value="{{ course.course_number }}" class="form-control-academic">
                </div>
                <div class="col-md-6">
                    <label class="form-label-academic">Expected Students</label>
                    <input type="number" name="expected_students" value="{{ course.expected_students or 0 }}" min="0" class="form-control-academic">
                </div>
                <div class="col-12">
                    <label class="form-label-academic">Title *</label>
                    <input type="text" name="title" required value="{{ course.title or '' }}" class="form-control-academic">
                </div>
                <div class="col-12 text-end mt-3">
                    <a href="/dashboard/{{ user.role_id }}" class="btn btn-secondary-academic me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary-academic">Save Changes</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
