<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title | default("University Timetable System") }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    {% block head_extra %}{% endblock %}
    <style>
        .back-btn-bar { padding: 10px 24px 0 24px; }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: white;
            border: 2px solid var(--primary-blue, #1a4d7a);
            color: var(--primary-blue, #1a4d7a);
            border-radius: 8px;
            padding: 7px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 2px 6px rgba(26,77,122,0.08);
        }
        .back-btn:hover {
            background: var(--primary-blue, #1a4d7a);
            color: white;
            box-shadow: 0 4px 12px rgba(26,77,122,0.18);
        }
    </style>
</head>
<body class="{% block body_class %}bg-light-academic{% endblock %}">

{% block navbar %}{% endblock %}

{% if flash_success %}
<div class="container-fluid px-4 mt-3">
    <div class="alert alert-success alert-dismissible fade show" role="alert" style="border-radius: 12px;">
        <strong>OK</strong> {{ flash_success }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>
{% endif %}

{% if flash_error %}
<div class="container-fluid px-4 mt-3">
    <div class="alert alert-danger alert-dismissible fade show" role="alert" style="border-radius: 12px;">
        <strong>Error</strong> {{ flash_error }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>
{% endif %}

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}

</body>
</html>
