<!-- ═══════════════════════════════════════════════════════════════════════════ -->
<!-- CHAT WIDGET — Include this partial in any dashboard template               -->
<!-- Requires: user.role to be set in the template context                      -->
<!-- ═══════════════════════════════════════════════════════════════════════════ -->

<style>
/* ── Chat FAB ── */
.chat-fab {
    position: fixed;
    bottom: 28px;
    right: 28px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a4d7a 0%, #0d3b66 100%);
    color: #fff;
    border: none;
    box-shadow: 0 6px 24px rgba(26, 77, 122, 0.4);
    cursor: pointer;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
}
.chat-fab:hover {
    transform: scale(1.08);
    box-shadow: 0 8px 32px rgba(26, 77, 122, 0.5);
}
.chat-fab svg { width: 26px; height: 26px; }
.chat-fab .chat-fab-badge {
    position: absolute;
    top: -2px;
    right: -2px;
    width: 14px;
    height: 14px;
    background: #ef4444;
    border-radius: 50%;
    border: 2px solid #fff;
    display: none;
}

/* ── Chat Panel ── */
.chat-panel {
    position: fixed;
    bottom: 96px;
    right: 28px;
    width: 380px;
    max-height: 520px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.18);
    z-index: 9999;
    display: none;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #e5e7eb;
}
.chat-panel.open {
    display: flex;
    animation: chatSlideUp 0.25s ease;
}
@keyframes chatSlideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* Header */
.chat-header {
    background: linear-gradient(135deg, #1a4d7a 0%, #0d3b66 100%);
    color: #fff;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
}
.chat-header-info {
    display: flex;
    align-items: center;
    gap: 10px;
}
.chat-header-dot {
    width: 8px;
    height: 8px;
    background: #4ade80;
    border-radius: 50%;
    flex-shrink: 0;
}
.chat-header h4 {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
}
.chat-header p {
    margin: 0;
    font-size: 11px;
    opacity: 0.75;
}
.chat-close-btn {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    padding: 4px;
    opacity: 0.7;
    transition: opacity 0.2s;
}
.chat-close-btn:hover { opacity: 1; }

/* Messages */
.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 280px;
    max-height: 340px;
    background: #f9fafb;
}
.chat-msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.55;
    word-wrap: break-word;
    white-space: pre-wrap;
}
.chat-msg.assistant {
    background: #fff;
    color: #1a1a2e;
    border: 1px solid #e5e7eb;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
}
.chat-msg.user {
    background: linear-gradient(135deg, #1a4d7a, #0d3b66);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
}
.chat-msg.error {
    background: #fef2f2;
    color: #991b1b;
    border: 1px solid #fecaca;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
}
.chat-typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 10px 16px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
}
.chat-typing span {
    width: 6px;
    height: 6px;
    background: #9ca3af;
    border-radius: 50%;
    animation: typingBounce 1.2s infinite;
}
.chat-typing span:nth-child(2) { animation-delay: 0.15s; }
.chat-typing span:nth-child(3) { animation-delay: 0.3s; }
@keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
}

/* Input */
.chat-input-bar {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    border-top: 1px solid #e5e7eb;
    background: #fff;
    flex-shrink: 0;
    gap: 8px;
}
.chat-input {
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 13px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.2s;
    resize: none;
    max-height: 80px;
    min-height: 38px;
}
.chat-input:focus {
    border-color: #1a4d7a;
}
.chat-send-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, #1a4d7a, #0d3b66);
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s;
}
.chat-send-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}
.chat-send-btn svg { width: 18px; height: 18px; }

/* Scrollbar */
.chat-messages::-webkit-scrollbar { width: 5px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

/* Mobile */
@media (max-width: 480px) {
    .chat-panel {
        right: 8px;
        left: 8px;
        width: auto;
        bottom: 80px;
        max-height: 70vh;
    }
}
</style>

<!-- FAB Button -->
<button class="chat-fab" id="chatFab" title="Schedule Assistant">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
    </svg>
    <div class="chat-fab-badge" id="chatBadge"></div>
</button>

<!-- Chat Panel -->
<div class="chat-panel" id="chatPanel">
    <div class="chat-header">
        <div class="chat-header-info">
            <div class="chat-header-dot"></div>
            <div>
                <h4>Schedule Assistant</h4>
                <p>Ask about your timetable</p>
            </div>
        </div>
        <button class="chat-close-btn" id="chatClose" title="Close">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="chat-msg assistant">
            👋 Hi{{ ' ' + user.name.split(' ')[0] if user and user.name else '' }}! I'm your Schedule Assistant.
            Ask me anything about your timetable — like "Am I free on Tuesday?" or "Where is my next lecture?"
        </div>
    </div>
    <div class="chat-input-bar">
        <textarea class="chat-input" id="chatInput" placeholder="Type a message..." rows="1"></textarea>
        <button class="chat-send-btn" id="chatSend" title="Send">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
            </svg>
        </button>
    </div>
</div>

<script>
(function() {
    const fab     = document.getElementById('chatFab');
    const panel   = document.getElementById('chatPanel');
    const closeBtn= document.getElementById('chatClose');
    const input   = document.getElementById('chatInput');
    const sendBtn = document.getElementById('chatSend');
    const msgBox  = document.getElementById('chatMessages');
    const badge   = document.getElementById('chatBadge');

    let history = [];
    let sending = false;

    // Toggle panel
    fab.addEventListener('click', () => {
        panel.classList.toggle('open');
        badge.style.display = 'none';
        if (panel.classList.contains('open')) {
            input.focus();
            scrollBottom();
        }
    });
    closeBtn.addEventListener('click', () => panel.classList.remove('open'));

    // Send on Enter (Shift+Enter for newline)
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            doSend();
        }
    });
    sendBtn.addEventListener('click', doSend);

    // Auto-resize textarea
    input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 80) + 'px';
    });

    function scrollBottom() {
        requestAnimationFrame(() => {
            msgBox.scrollTop = msgBox.scrollHeight;
        });
    }

    function appendMsg(role, text) {
        const div = document.createElement('div');
        div.className = 'chat-msg ' + role;
        div.textContent = text;
        msgBox.appendChild(div);
        scrollBottom();
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'chat-typing';
        div.id = 'typingIndicator';
        div.innerHTML = '<span></span><span></span><span></span>';
        msgBox.appendChild(div);
        scrollBottom();
    }

    function hideTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    async function doSend() {
        const text = input.value.trim();
        if (!text || sending) return;

        sending = true;
        sendBtn.disabled = true;
        input.value = '';
        input.style.height = 'auto';

        appendMsg('user', text);
        history.push({ role: 'user', content: text });

        showTyping();

        try {
            const resp = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: text,
                    history: history.slice(-20)
                }),
                credentials: 'same-origin'
            });

            hideTyping();

            if (!resp.ok) {
                const err = await resp.json().catch(() => ({}));
                const errMsg = err.error || 'Something went wrong. Please try again.';
                appendMsg('error', errMsg);
            } else {
                const data = await resp.json();
                const reply = data.reply || 'Sorry, I could not generate a response.';
                appendMsg('assistant', reply);
                history.push({ role: 'assistant', content: reply });
            }
        } catch (e) {
            hideTyping();
            appendMsg('error', 'Network error — please check your connection.');
        }

        sending = false;
        sendBtn.disabled = false;
        input.focus();
    }
})();
</script>
